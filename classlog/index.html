<body>
  <h1>수업로그</h1>

  <p>
    수업로그는 학생, 학급, 수업, 평가 및 활동 기록을 관리하기 위한
    Windows 데스크톱 애플리케이션입니다.
  </p>

  <h2>Google 연동</h2>

  <p>
    수업로그는 Google Drive API를 이용하여 사용자의 여러 PC 간에
    애플리케이션 데이터를 동기화할 수 있습니다.
  </p>

  <p>
    동기화 데이터는 사용자의 Google Drive 앱 데이터 영역에 저장됩니다.
    또한 사용자가 요청한 경우 Google Drive에 파일을 내보낼 수 있습니다.
  </p>

  <p>
    <a href="/classlog/privacy.html">개인정보처리방침</a>
  </p>
